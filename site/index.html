<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="AL-Phone Niamey — Téléphones, accessoires et bien plus. Catalogue en ligne, contactez-nous sur WhatsApp.">
<title>AL-Phone — Catalogue</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f4f6;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--ac:#e8590c;--ac2:#fff;--ok:#16a34a;--rd:#dc2626;--star:#f59e0b;--head:#131921;--head2:#232f3e;--r:14px;--sh:0 1px 2px rgba(0,0,0,.06),0 8px 24px -12px rgba(0,0,0,.25);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1218;--card:#171c26;--tx:#f3f4f6;--mu:#9ca3af;--bd:#2a3140;--ac:#ff8a3d;--ac2:#14161d;--head:#0b0e14;--head2:#171c26;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1218;--card:#171c26;--tx:#f3f4f6;--mu:#9ca3af;--bd:#2a3140;--ac:#ff8a3d;--ac2:#14161d;--head:#0b0e14;--head2:#171c26;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--ac);text-decoration:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 70%,#fff);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
header.top{background:var(--head);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:50;padding:8px 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head);z-index:60}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-size:19px;font-weight:800;cursor:pointer;white-space:nowrap}
.hsearch{flex:1;display:flex;min-width:200px}
.hsearch input{border:0;border-radius:8px 0 0 8px;padding:10px 12px;margin:0;flex:1;background:#fff;color:#111}
.hsearch button{border:0;border-radius:0 8px 8px 0;padding:10px 16px;background:var(--ac);color:#fff;font-weight:700;cursor:pointer}
.hbtn{background:none;border:1px solid transparent;color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px;line-height:1.2}
.hbtn:hover{border-color:#fff}
.hbtn.ic{font-size:16px;padding:6px 9px}
.catbar{background:var(--head2)}
.catbar .wrap{display:flex;gap:4px;overflow-x:auto;padding:4px 14px}
.catbar button{background:none;border:0;color:#e5e7eb;padding:8px 12px;cursor:pointer;white-space:nowrap;border-radius:6px;font:inherit;font-size:14px}
.catbar button:hover{background:rgba(255,255,255,.14)}
main{padding:16px 0 30px}
.btn{border:0;background:var(--ac);color:var(--ac2);padding:11px 18px;border-radius:9px;font:inherit;font-weight:700;cursor:pointer;display:inline-block}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.d{background:var(--rd);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.block{width:100%;text-align:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:9px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0 10px}
label{font-size:13px;color:var(--mu);font-weight:600}
.mu{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;cursor:pointer;position:relative;transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-3px)}
.ph{aspect-ratio:1;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:54px;position:relative;overflow:hidden}
.ph img,.big img{width:100%;height:100%;object-fit:cover}
.ph img{transition:transform .35s}.card:hover .ph img{transform:scale(1.06)}
.badge{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;color:#fff;z-index:2}
.badge.promo{background:var(--rd)}.badge.top{background:var(--ok);top:30px}.badge.low{background:#d97706;top:52px}
.card .i{padding:10px}
.nm{font-weight:600;font-size:14px;min-height:40px}
.pr{font-weight:800;color:var(--ac);font-size:16px}
.old{text-decoration:line-through;color:var(--mu);font-size:12px;margin-left:5px}
.stars{color:var(--star);font-size:12px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);color:var(--mu)}
.tag.on{border-color:var(--ac);color:var(--ac);font-weight:700}
.box{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:16px;margin-bottom:14px}
.sec-t{font-size:18px;font-weight:800;margin:14px 0 10px}
.pd{display:grid;gap:16px}@media(min-width:720px){.pd{grid-template-columns:minmax(280px,420px) 1fr}}
.big{display:flex;justify-content:center;font-size:100px;background:var(--bg);border-radius:13px;overflow:hidden;aspect-ratio:1;align-items:center;position:relative}
.tabs{display:flex;border-bottom:1px solid var(--bd)}
.tabs button{flex:1;background:none;border:0;padding:11px;font:inherit;font-weight:700;color:var(--mu);cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
.cm{border-top:1px solid var(--bd);padding:10px 0}
.sumrow{display:flex;justify-content:space-between;padding:5px 0}
.pill{display:inline-block;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);font-weight:700;font-size:13px;padding:4px 10px;border-radius:99px}
.secure{font-size:12px;color:var(--mu);margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center}
.kpi b{display:block;font-size:20px;color:var(--ac)}
footer{background:var(--head);color:#d1d5db;margin-top:30px;padding:24px 0 40px;font-size:14px}
footer h4{color:#fff;margin:0 0 8px}
footer .cols{display:grid;gap:18px;grid-template-columns:1fr 1fr;margin-top:18px}@media(min-width:720px){footer .cols{grid-template-columns:repeat(4,1fr)}}
footer button{background:none;border:0;color:#d1d5db;cursor:pointer;padding:3px 0;font:inherit;text-align:left;display:block}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:99;font-size:14px;white-space:nowrap}
.tbl{width:100%;border-collapse:collapse}.tbl td,.tbl th{padding:10px 6px;border-bottom:1px solid var(--bd);vertical-align:middle;text-align:left}
.ic{width:52px;height:52px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}
.ic img{width:100%;height:100%;object-fit:cover}
.tiles{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.tile{flex:none;width:76px;text-align:center;cursor:pointer;font-size:12px;font-weight:600;background:none;border:0;color:var(--tx);font-family:inherit}
.tile i{display:flex;width:62px;height:62px;border-radius:50%;background:var(--card);border:2px solid var(--bd);align-items:center;justify-content:center;font-size:28px;margin:0 auto 5px;font-style:normal;transition:border-color .2s}
.tile.on i,.tile:hover i{border-color:var(--ac)}
.slides{position:relative;border-radius:var(--r);overflow:hidden;margin-bottom:16px;color:#fff;min-height:170px}
.slide{display:none;padding:28px 24px 40px;min-height:170px}
.slide.on{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:8px}
.slide h1{margin:0;font-size:clamp(22px,4.6vw,34px);line-height:1.15;max-width:18ch}
.slide p{margin:0;opacity:.95;max-width:42ch}
.s1{background:linear-gradient(120deg,#c2410c,#f59e0b)}.s2{background:linear-gradient(120deg,#1e3a8a,#0ea5e9)}.s3{background:linear-gradient(120deg,#14532d,#22c55e)}
.slide .btn{background:#fff;color:#111}
.cd{display:flex;gap:6px}.cd b{background:rgba(0,0,0,.28);border-radius:8px;padding:4px 8px;font-variant-numeric:tabular-nums;font-size:18px}
.sdots{position:absolute;bottom:12px;right:16px;display:flex;gap:6px}
.sdots button{width:9px;height:9px;border-radius:9px;border:0;background:rgba(255,255,255,.5);padding:0;cursor:pointer}
.sdots button.on{width:22px;background:#fff}
.trust{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
@media(min-width:700px){.trust{grid-template-columns:repeat(4,1fr)}}
.trust div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:center}
.trust span{font-size:20px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sh h2{margin:0;font-size:20px}.sh a{font-size:13px;font-weight:600;cursor:pointer}
/* Bouton WhatsApp dans les cartes */
.qa{display:block;margin-top:8px;width:100%;border:1.5px solid #25d366;background:transparent;color:#25d366;border-radius:9px;padding:7px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;text-align:center;text-decoration:none}
.qa:hover{background:#25d366;color:#fff}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.sk{background:linear-gradient(90deg,var(--bd) 25%,var(--bg) 50%,var(--bd) 75%);background-size:200% 100%;animation:shim 1.2s linear infinite;border-radius:var(--r)}
.sk.c{aspect-ratio:.78}
@keyframes shim{to{background-position:-200% 0}}
.bnav{display:none}
@media(max-width:700px){
 .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:55;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
 .bnav button{flex:1;background:none;border:0;color:var(--mu);padding:8px 0 6px;font:inherit;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
 .bnav button span{font-size:20px;line-height:1}.bnav button.on{color:var(--ac);font-weight:700}
 body{padding-bottom:calc(62px + env(safe-area-inset-bottom,0px))}
 .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
@media(prefers-reduced-motion:reduce){.sk{animation:none}.card,.ph img{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap hrow">
  <div class="logo" id="logo"></div>
  <div class="hsearch"><input id="hq" placeholder="Rechercher un article…" aria-label="Rechercher"><button id="hqs" aria-label="Rechercher">🔍</button></div>
  <a href="admin.html" class="hbtn" style="border:1.5px solid var(--ac);color:var(--ac);font-weight:700">⚙️ Espace Admin</a>
  <button class="hbtn ic" id="hbTheme" aria-label="Changer de thème">🌓</button>
</div></header>
<div class="catbar"><div class="wrap" id="catnav"></div></div>
<main class="wrap" id="app"></main>
<footer><div class="wrap">
  <div class="kpis">
    <div class="kpi">📍<b>AL-Phone</b><span class="mu">Niamey, Gendarmerie</span></div>
    <div class="kpi">💬<b>WhatsApp</b><span class="mu">Contact direct</span></div>
    <div class="kpi">↩️<b>Retours</b><span class="mu">Sous 7 jours</span></div>
    <div class="kpi">🛡️<b>Garantie</b><span class="mu">6 mois téléphones</span></div>
  </div>
  <div class="cols">
    <div><h4>À propos</h4>
      <button data-go="page/about">AL-Phone Niamey</button>
      <button data-go="page/about">Nous contacter</button>
    </div>
    <div><h4>Aide</h4>
      <button data-go="page/delivery">Livraison &amp; retours</button>
      <button data-go="page/payment">Paiement</button>
      <button data-go="page/faq">FAQ</button>
    </div>
    <div><h4>Catalogue</h4>
      <button data-go="cat-Téléphones">📱 Téléphones</button>
      <button data-go="cat-Pochettes">🧴 Pochettes</button>
      <button data-go="cat-Numérique">🎧 Numérique</button>
    </div>
    <div><h4>Boutique</h4>
      <div id="footInfo" class="mu"></div>
      <div class="mu" style="margin-top:6px">Derrière l'école de la Gendarmerie, Niamey.</div>
    </div>
  </div>
  <p class="mu" style="text-align:center;margin-top:20px">© 2026 AL-Phone · <span id="footPay"></span> · <a href="admin.html" style="color:inherit">Admin</a></p>
</div></footer>
<nav class="bnav" aria-label="Navigation">
  <button data-n="boutique"><span>🏠</span>Accueil</button>
  <button data-n="cat"><span>🗂️</span>Catégories</button>
  <button data-n="page/about"><span>💬</span>Contact</button>
  <button onclick="location.href='admin.html'"><span>⚙️</span>Admin</button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
